# CycloneFusion-AI Global Configuration
project_name: "CycloneFusion-AI"
version: "0.1.0"
basin_focus:
  primary: "North Indian Ocean"
  sub_basins:
    - "Bay of Bengal"
    - "Arabian Sea"
  spatial_bounds:
    lat_min: 0.0
    lat_max: 35.0
    lon_min: 45.0
    lon_max: 105.0

seed: 42
deterministic: true

compute:
  device: "cpu"  # "cpu", "cuda", "mps"
  num_workers: 2
  pin_memory: false
  mixed_precision: false
  debug_mode: true

logging:
  level: "INFO"
  format: "json"
  log_dir: "reports/logs"
  mlflow:
    tracking_uri: "http://localhost:5000"
    experiment_name: "cyclonefusion_nio_benchmark"
